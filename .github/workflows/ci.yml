name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check
        type: string
        default: ''
      skip-ios:
        description: Caller provides its own consolidated iOS checks
        type: boolean
        default: false
      release-packages:
        description: Export the Android Maven publication from the existing build job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  android:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: ktlint
            name: Code style
            tasks: ':ktlintCheck :kmp:ktlintCheck :samples:kotlin-kmp-app:ktlintCheck'
          - check: unit-tests
            name: Unit tests (Android)
            tasks: ':kmp:testDebugUnitTest :kmp:testReleaseUnitTest'
          - check: lint
            name: Android Lint
            tasks: ':kmp:lintDebug :kmp:lintRelease'
          - check: build
            name: Android build
            tasks: ':kmp:assembleDebug :kmp:assembleRelease'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Run ${{ matrix.name }}
        env:
          EXPORT_MAVEN: ${{ inputs.release-packages && matrix.check == 'build' }}
        run: |
          extra=()
          if [[ "$EXPORT_MAVEN" == true ]]; then
            extra+=(':kmp:publishAndroidReleasePublicationToMavenLocal' '-PsignAllPublications=false' "-Dmaven.repo.local=$RUNNER_TEMP/release-maven-android")
          fi
          ./gradlew ${{ matrix.tasks }} "${extra[@]}" --no-daemon --stacktrace

      - name: Export the Android Maven publication for release review
        if: ${{ inputs.release-packages && matrix.check == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-maven-android
          path: ${{ runner.temp }}/release-maven-android/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports and available AARs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.check }}
          path: |
            kmp/build/outputs/aar/
            kmp/build/reports/
            kmp/build/test-results/
            build/reports/ktlint/
            samples/kotlin-kmp-app/build/reports/ktlint/
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS tests and build
    needs: android
    if: ${{ !inputs.skip-ios }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Xcode 16.4 supports the project's iOS 13 deployment target.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-native
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Test and link iOS frameworks in one Gradle invocation
        run: >-
          ./gradlew :kmp:iosSimulatorArm64Test
          :kmp:linkDebugFrameworkIosArm64 :kmp:linkDebugFrameworkIosSimulatorArm64
          :kmp:linkDebugFrameworkIosX64 --continue --no-daemon --stacktrace

      - name: Upload test reports and resolved pod versions
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: |
            kmp/build/reports/tests/
            kmp/build/test-results/
            kmp/build/cocoapods/synthetic/ios/Podfile.lock
          if-no-files-found: warn
          retention-days: 7
